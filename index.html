<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cânon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f2e8d2;--paper:#f8f0de;--ink:#2a1b15;--soft:#4a382c;--muted:#7a6650;--line:#d3bd93;
 --accent:#7d1424;--gold:#b0852f;--hl:#ecd596;--tint:#b0852f1f;
 --g1:#b32a40;--g2:#6d1121;--g3:#43091480;
 --sb1:#4b1221;--sb2:#250910;--sbink:#efe3c8;--sbgold:#dcb96e;
 --disp:"Cormorant Garamond","Iowan Old Style",Palatino,Georgia,serif;
 --body:"Source Serif 4","Iowan Old Style",Georgia,serif;
 --cap:"Cinzel","Cormorant Garamond",Georgia,serif;
 --noise:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .09 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
 color-scheme:light}
:root[data-theme=dark]{
 --bg:#110c0a;--paper:#1a1310;--ink:#eadfc6;--soft:#cdbf9f;--muted:#a08e74;--line:#33261c;
 --accent:#e2a65a;--gold:#d4a84f;--hl:#4a3a1c;--tint:#d4a84f17;
 --g1:#f6dd96;--g2:#d4a84f;--g3:#8d642280;
 --sb1:#150b09;--sb2:#0a0605;
 color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:auto;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.7 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(120% 70% at 50% -10%,#fff7,transparent 60%),radial-gradient(90% 80% at 50% 120%,#7a3a0a20,transparent 60%)}
:root[data-theme=dark] body::before{
 background:radial-gradient(70% 55% at 50% -8%,#d4a84f2b,transparent 70%),radial-gradient(100% 60% at 50% 120%,#7d142414,transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--noise);opacity:.7}
:root[data-theme=dark] body::after{opacity:.25;mix-blend-mode:screen}
::selection{background:var(--accent);color:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#pg{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;background:linear-gradient(90deg,var(--gold),var(--accent));box-shadow:0 0 10px var(--gold);pointer-events:none}

/* ---------- Alternância entre apresentação e leitura ---------- */
body[data-view=home] aside,body[data-view=home] #open,body[data-view=home] #bd{display:none!important}
body[data-view=home] main{margin-left:0}
body[data-view=home] #reader{display:none}
body[data-view=read] #home,body[data-view=read] .hb{display:none}

/* ---------- Barra superior da apresentação ---------- */
.hb{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:2.3rem 3rem;transition:padding .3s,background .3s,border-color .3s;border-bottom:1px solid transparent}
.hb.sc{padding:.7rem 1.4rem;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom-color:var(--line)}
.hb .br{font:italic 600 1.9rem/1 var(--disp);color:var(--accent);text-decoration:none;letter-spacing:.02em}
.hb .br::before{content:"◆";font-style:normal;font-size:.32em;margin-right:.6rem;vertical-align:.6em;opacity:.8}
.hb .go{padding:.6rem 1.1rem;border:1px solid var(--gold);color:var(--accent);font:600 .66rem var(--cap);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:background .3s,color .3s}
.hb .go:hover{background:var(--gold);color:var(--paper)}

/* ---------- Lateral ---------- */
aside{position:fixed;inset:0 auto 0 0;width:300px;z-index:20;background:linear-gradient(180deg,var(--sb1),var(--sb2));color:var(--sbink);display:flex;flex-direction:column;padding:1.4rem 0 1rem;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:inset -1px 0 0 #dcb96e40,8px 0 40px #0006}
body.closed aside{transform:translateX(-100%)}
main{position:relative;z-index:1;margin-left:300px;transition:margin .3s cubic-bezier(.4,0,.2,1)}
body.closed main{margin-left:0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem 1.1rem}
.sh a{display:block;text-decoration:none;color:var(--sbgold)}
.sh a b{display:block;font:italic 600 2rem/1 var(--disp);letter-spacing:.02em}
.sh a b::before{content:"◆";font-style:normal;font-size:.32em;margin-right:.65rem;vertical-align:.55em;opacity:.8}
.sh a small{display:block;margin-top:.45rem;font:600 .54rem/1.4 var(--cap);letter-spacing:.24em;text-transform:uppercase;color:#efe3c8a0}
.ib{width:2.2rem;height:2.2rem;border:1px solid #dcb96e55;border-radius:50%;background:none;color:var(--sbink);font-size:1rem;line-height:1;transition:background .2s,border-color .2s}
.ib:hover{background:#dcb96e22;border-color:var(--sbgold)}
#open{position:fixed;top:.9rem;left:.9rem;z-index:15;display:none;background:var(--paper);color:var(--accent);border-color:var(--gold);box-shadow:0 4px 16px #0003}
body.closed #open{display:block}
#sb{margin:0 1.2rem 1.1rem;text-align:left;padding:.65rem .9rem;border:1px solid #dcb96e44;border-radius:2px;background:#ffffff0a;color:#efe3c8b0;font-size:.9rem;transition:border-color .2s,background .2s}
#sb:hover{border-color:var(--sbgold);background:#ffffff12}
nav{flex:1;overflow:auto;font-size:.95rem;line-height:1.3;padding-bottom:.5rem;scrollbar-width:thin;scrollbar-color:#dcb96e55 transparent}
nav a{display:flex;gap:.8rem;align-items:baseline;text-decoration:none;padding:.5rem 1.2rem;border-left:2px solid transparent;color:#efe3c8bb;transition:background .2s,color .2s}
nav a:hover{color:#fff;background:#ffffff0c}
nav a b{font:600 .72rem var(--cap);letter-spacing:.06em;color:var(--sbgold);min-width:2.5rem;text-align:right}
nav a.on{border-color:var(--sbgold);background:linear-gradient(90deg,#dcb96e2b,transparent);color:#fff}
nav a.done span::after{content:" ✓";color:var(--sbgold);font-size:.85em}
.sf{padding:.9rem 1.2rem 0;border-top:1px solid #dcb96e30;font-size:.85rem;color:#efe3c8aa;display:grid;gap:.55rem}
#prog{font-style:italic;font-size:.82rem}
#lg{display:grid;gap:.35rem}
#lt{font-size:.82rem}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.sf .bar{background:#dcb96e30}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.sf details div{display:grid;gap:.4rem;margin-top:.55rem}
.sf summary{cursor:pointer;font:600 .68rem var(--cap);letter-spacing:.22em;text-transform:uppercase;color:var(--sbgold)}
.sf button,.sf a.d{padding:.45rem .7rem;border:1px solid #dcb96e40;border-radius:2px;background:none;color:var(--sbink);text-align:left;text-decoration:none;transition:background .2s,border-color .2s}
.sf button:hover:not(:disabled),.sf a.d:hover{background:#dcb96e1c;border-color:var(--sbgold)}
.sf button:disabled{opacity:.4;cursor:default}

/* ---------- Capa ---------- */
.cover{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 2.5rem 7rem}
.cover::before{content:"";position:absolute;inset:1.2rem;border:1px solid var(--gold);opacity:.75;pointer-events:none}
.cover::after{content:"";position:absolute;inset:1.65rem;border:1px solid var(--gold);opacity:.3;pointer-events:none}
.cn{position:absolute;width:2.4rem;height:2.4rem;border:2px solid var(--gold);pointer-events:none}
.cn.tl{top:calc(1.2rem - 3px);left:calc(1.2rem - 3px);border-right:0;border-bottom:0}
.cn.tr{top:calc(1.2rem - 3px);right:calc(1.2rem - 3px);border-left:0;border-bottom:0}
.cn.bl{bottom:calc(1.2rem - 3px);left:calc(1.2rem - 3px);border-right:0;border-top:0}
.cn.br{bottom:calc(1.2rem - 3px);right:calc(1.2rem - 3px);border-left:0;border-top:0}
.crest{width:6rem;height:6rem;color:var(--gold);margin-bottom:1.8rem;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .1s both}
.cover h1{font:600 clamp(3.2rem,10vw,7.2rem)/1.02 var(--disp);margin:0;letter-spacing:.015em;padding-bottom:.08em;max-width:14ch;text-wrap:balance;
 background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .25s both}
.cover .st{font:italic 500 clamp(1.3rem,3vw,1.95rem) var(--disp);margin:1rem 0 0;color:var(--soft);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .4s both}
.cover .orn{width:100%;max-width:17rem;margin:2rem auto;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .5s both}
.cover .lead{font:italic 500 clamp(1.25rem,2.6vw,1.6rem)/1.45 var(--disp);max-width:30rem;margin:0 0 1.3rem;color:var(--ink);text-wrap:balance;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .55s both}
.cover .tt{font:500 .78rem/1.8 var(--cap);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;max-width:30rem;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .65s both}
.acts{margin-top:2.6rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.9rem;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .8s both}
.begin{display:inline-flex;align-items:center;gap:.8rem;padding:.9rem 1.9rem;border:1px solid var(--gold);color:var(--accent);font:600 .76rem var(--cap);letter-spacing:.26em;text-transform:uppercase;text-decoration:none;transition:background .3s,color .3s,box-shadow .3s}
.begin::after{content:"→";font-size:1rem;letter-spacing:0}
.begin.ghost{border-color:var(--line);color:var(--soft)}
.begin.ghost::after{content:"↓"}
.begin.alt{background:var(--gold);color:var(--paper)}
.begin:hover{background:var(--gold);color:var(--paper);border-color:var(--gold);box-shadow:0 8px 28px #b0852f40}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.cf{position:absolute;left:0;right:0;bottom:2.7rem;text-align:center;padding:0 2.4rem;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .95s both}
.c1{margin:0;font:500 1rem/1.6 var(--disp);letter-spacing:.06em;color:var(--muted)}
.c2{margin:.15rem 0 0;font:italic 500 .95rem/1.5 var(--disp);color:var(--muted)}
.c1 b,.c2 b{font-style:italic;font-weight:600;color:var(--accent)}
.cf .c1{font-size:.88rem}
.cf .c2{font-size:.85rem}

/* ---------- Ornamentos e rótulos ---------- */
.col{max-width:44rem;margin:0 auto;padding:0 1.6rem}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.6rem}
.orn{display:flex;align-items:center;gap:1rem;color:var(--gold);margin:2.4rem auto;max-width:16rem}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
.orn::after{transform:scaleX(-1)}
.orn i{position:relative;width:3.2rem;height:.6rem;
 background:radial-gradient(circle,currentColor 0 1.6px,transparent 2.2px) 0 50%/.6rem .6rem no-repeat,radial-gradient(circle,currentColor 0 1.6px,transparent 2.2px) 100% 50%/.6rem .6rem no-repeat}
.orn i::after{content:"";position:absolute;left:50%;top:50%;width:.62rem;height:.62rem;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.ey{font:600 .72rem var(--cap);letter-spacing:.55em;text-transform:uppercase;color:var(--accent);padding-left:.55em;text-align:center}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- Apresentação (partes 1 a 9) ---------- */
.sec{padding:6.5rem 0 .5rem;scroll-margin-top:4.5rem}
.sec h2{font:600 clamp(1.8rem,4.4vw,2.6rem)/1.15 var(--disp);margin:.5rem 0 0;text-align:center;text-wrap:balance}
.sec p{margin:1rem 0;font-size:1.13rem;line-height:1.85;text-wrap:pretty}
.sec p b{color:var(--accent);font-weight:600}
#p1 p:first-of-type::first-letter{font:600 4.4rem/.78 var(--disp);float:left;padding:.4rem .65rem 0 0;color:var(--accent)}
.pl{margin:1.4rem 0 0;padding:0;list-style:none;columns:2;column-gap:2rem;counter-reset:pl}
.pl li{counter-increment:pl;break-inside:avoid;padding:.3rem 0}
.pl a{text-decoration:none;display:flex;gap:.7rem;align-items:baseline}
.pl a::before{content:counter(pl);font:600 .8rem var(--cap);color:var(--accent);min-width:1.4rem}
.pl a:hover{color:var(--accent)}
.areas{display:grid;gap:1.1rem;margin-top:1.6rem}
.ag{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem .6rem}
.ag .l{font:600 .66rem var(--cap);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);min-width:9.5rem}
.chip{padding:.28rem .85rem;border:1px solid var(--gold);border-radius:999px;font-size:.98rem;background:var(--paper)}
.ag.p .chip{background:var(--gold);color:var(--paper);font-weight:600}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem}
.nm{text-align:center;padding:1.6rem .8rem;border:1px solid var(--line);background:var(--paper)}
.nm b{display:block;font:600 clamp(2.4rem,7vw,3.8rem)/1 var(--disp);background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.nm span{display:block;font:600 .66rem/1.5 var(--cap);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:.5rem}
.nm small{display:block;margin-top:.4rem;font-size:.85rem;line-height:1.4;color:var(--muted)}
.hprog{margin-top:1.8rem;text-align:center}
.hprog p{margin:0}
.hprog .bar{max-width:24rem;margin:.7rem auto 0}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;font:inherit;font-size:.9rem;margin-top:.9rem;padding:0}
.shelf{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:.4rem;height:18rem;margin:2.4rem 0 1.4rem;padding:0 .6rem}
.shelf::after{content:"";position:absolute;left:-.3rem;right:-.3rem;bottom:-.9rem;height:.9rem;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--line));box-shadow:0 8px 14px #0002}
.sp{position:relative;flex:1;max-width:5.2rem;min-width:0;height:calc(10.8rem + 7.2rem * var(--r,1));padding:0;border:1px solid hsl(var(--h) 25% 24%);border-radius:3px 3px 0 0;background:hsl(var(--h) 18% 36%);overflow:hidden;color:#fff;cursor:pointer;transition:transform .3s,box-shadow .3s}
.spf{position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:linear-gradient(90deg,hsl(var(--h) 50% 46%),hsl(var(--h) 52% 38%));transition:height .5s,width .5s}
.sp::before{content:"";position:absolute;z-index:1;top:.55rem;left:0;right:0;height:3px;background:var(--gold);box-shadow:0 .5rem 0 var(--gold)}
.spn{position:absolute;z-index:1;top:1.9rem;bottom:2.4rem;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font:600 .66rem/1 var(--cap);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0008}
.spb{position:absolute;z-index:1;bottom:.55rem;left:0;right:0;font:700 .78rem/1 var(--cap);text-align:center;text-shadow:0 1px 2px #0008}
.sp:hover,.sp:focus-visible,.sp.on{transform:translateY(-10px);box-shadow:0 14px 24px #0003;outline-offset:4px}
.scap{min-height:3.2rem;margin:2rem 0 0;text-align:center;font-size:1rem;line-height:1.5;color:var(--soft)}
.scap b{color:var(--accent);font-weight:600}
.dot{display:inline-block;flex:none;width:.55rem;height:.55rem;border-radius:50%;margin-right:.4rem;background:hsl(var(--h) 42% 46%);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line)}
.demo{margin:1.8rem 0;border:1px dashed var(--gold);border-radius:4px;background:var(--bg);padding:.8rem .4rem}
.demo .it{margin:0}
.demo .it::before{display:none}
.demo .it:hover{background:none}
.leg{list-style:none;margin:1.2rem 0 0;padding:0;counter-reset:lg}
.leg li{counter-increment:lg;display:grid;grid-template-columns:1.9rem 1fr;gap:.8rem;margin:.9rem 0;line-height:1.6}
.leg li::before{content:counter(lg);display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent);color:var(--paper);font:700 .8rem/1 var(--body);margin-top:.15rem}
.leg li b{color:var(--accent);font-weight:600}
.fn{margin:1.8rem 0 0;display:grid}
.fn div{display:grid;grid-template-columns:9.5rem 1fr;gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}
.fn dt{font:600 .68rem/1.7 var(--cap);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.fn dd{margin:0;line-height:1.7}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.9rem;margin-top:2rem}
.mp{position:relative;overflow:hidden;display:grid;gap:.15rem;padding:1.1rem 1.2rem 1.25rem;border:1px solid var(--line);background:var(--paper);text-decoration:none;transition:border-color .25s,transform .25s,box-shadow .25s}
.mp:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 30px #0002}
.mp b{font:500 1.9rem/1.1 var(--cap);color:var(--accent)}
.mp .mn{font:600 1.18rem/1.2 var(--disp)}
.mp em{font-style:normal;font-size:.82rem;color:var(--muted)}
.mp .mpb{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:width .4s}
.cta{text-align:center;padding:5rem 0 1rem}
.cta p{font:italic 500 1.35rem var(--disp);margin:0 0 1.6rem}
.hend{padding:3rem 0 0}

/* ---------- Etapas ---------- */
.ch{padding:8rem 0 2.4rem;text-align:center}
.rn{font:500 clamp(4.4rem,16vw,9rem)/1.05 var(--cap);letter-spacing:.04em;margin:.4rem 0 .2rem;padding:0 .1em;
 background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.ch h2{font:600 clamp(1.9rem,4.4vw,2.8rem)/1.15 var(--disp);margin:.2rem 0 0;text-wrap:balance}
.ch p{font:500 .72rem var(--cap);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 0;padding-left:.26em}

/* ---------- Itens ---------- */
.it{position:relative;display:grid;grid-template-columns:3.7rem 1fr;padding:1.5rem 1rem;margin:0 -1rem;border-radius:3px;transition:background .35s}
.it::before{content:"";position:absolute;top:0;left:1rem;right:1rem;height:1px;background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line) 86%,transparent)}
.it:hover{background:linear-gradient(90deg,var(--tint),transparent 75%)}
.num{position:relative;justify-self:start;min-width:2.5rem;height:2.5rem;padding:0 .5rem;border:1px solid var(--gold);border-radius:999px;display:grid;place-items:center;
 font:600 .82rem var(--cap);letter-spacing:.02em;color:var(--accent);background:var(--paper);margin-top:.15rem;transition:background .25s,color .25s}
.bd2{padding-right:2.8rem}
.it h3{font:600 1.62rem/1.18 var(--disp);margin:0;letter-spacing:.005em}
.au{font:600 .74rem/1.6 var(--cap);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-top:.35rem}
.au.miss{font-family:var(--body);font-weight:400;font-style:italic;text-transform:none;letter-spacing:0;font-size:.92rem;opacity:.85}
.au span{margin-left:.7rem;font:italic 400 .95rem var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:.1rem 1rem;font-size:.82rem;color:var(--muted);margin:.5rem 0 0}
.it p{margin:.7rem 0 0;font-size:1.04rem;color:var(--soft);hyphens:auto;text-wrap:pretty}
.rd{position:absolute;top:1.55rem;right:1rem;width:2rem;height:2rem;padding:0;border:1px solid var(--gold);border-radius:50%;background:transparent;color:transparent;display:grid;place-items:center;transition:background .25s,color .25s,box-shadow .25s}
.rd::after{content:"✓";font:700 .95rem/1 var(--body)}
button.rd:hover{box-shadow:0 0 0 3px var(--tint);color:var(--gold)}
span.rd{cursor:default}

 if(!ex&&E.length&&E[0].items.length){exe=E[0];ex=exe.items[0]}

 const sec=(n,body)=>'<section class="sec rv" id="p'+n+'"><div class="wrap"><div class="ey">Parte '+n+' de 9</div><h2>'+PARTES[n-1]+'</h2><div class="orn"><i></i></div>'+body+'</div></section>';

 const areas='<div class="areas">'+TEXTO.areas.map(g=>'<div class="ag '+g[0]+'"><span class="l">'+esc(g[1])+'</span>'+g[2].map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>').join('')+'</div>';

 const nums='<div class="nums">'
  +'<div class="nm"><b>'+TOT+'</b><span>itens</span><small>obras na lista</small></div>'
  +'<div class="nm"><b>'+E.length+'</b><span>etapas</span><small>trechos da lista</small></div>'
  +'<div class="nm"><b>'+BL.length+'</b><span>blocos</span><small>grupos de itens</small></div></div><div class="hprog" id="hp"></div>';

 const mx=Math.max(1,...BL.map(b=>b.c));
 const blocks=BL.length?'<div class="shelf" id="shelf">'+BL.map(b=>'<button class="sp" type="button" data-b="'+b.n+'" data-nm="'+escA(b.name)+'" style="--h:'+(b.n*47%360)+';--r:'+(b.c/mx).toFixed(3)+'" aria-label="Bloco '+b.n+': '+escA(b.name)+'"><i class="spf"></i><span class="spn">'+esc(b.name)+'</span><span class="spb">'+b.n+'</span></button>').join('')+'</div><p class="scap" id="scap" aria-live="polite">Passe o mouse ou toque em uma lombada para ver os números.</p>':'';

 const demo=ex?'<div class="demo">'+itemHTML(exe,ex,true)+'</div><ol class="leg">'+TEXTO.partes.map(p=>'<li><div><b>'+esc(p[0])+'</b> '+esc(p[1])+'</div></li>').join('')+'</ol>':'';

 const uso='<ol class="leg">'+TEXTO.passos.map(t=>'<li><div>'+inl(t)+'</div></li>').join('')+'</ol>'
  +'<dl class="fn">'+TEXTO.funcoes.map(f=>'<div><dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd></div>').join('')+'</dl>'+P(TEXTO.salvar);

 const mapa=P(TEXTO.mapa)+'<div class="mgrid">'+E.map(e=>'<a class="mp" href="#e'+e.n+'" data-n="'+e.n+'"><b>'+roman(e.n)+'</b><span class="mn">'+esc(e.name)+'</span><em>'+e.items.length+' itens<span class="mc"></span></em><i class="mpb"></i></a>').join('')+'</div>';

 let h='<div id="home"><header class="cover" id="top"><span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>'
  +CREST+'<h1>'+esc(main)+'</h1>'+(sub?'<p class="st">'+esc(sub)+'</p>':'')
  +'<div class="orn"><i></i></div><p class="lead">'+esc(TEXTO.lead)+'</p><p class="tt">'+esc(T.total)+'</p>'
  +'<div class="acts"><a class="begin" href="#e'+first+'">Entrar na leitura</a><a class="begin alt" id="cont" href="#e'+first+'" hidden>Continuar de onde parei</a><a class="begin ghost" href="#p1">Entender o projeto</a></div>'
  +'<div class="cf">'+FOOT+'</div></header>'
  +'<section class="sec rv" id="indice"><div class="wrap"><div class="ey">Antes de começar</div><h2>Como esta página funciona</h2><div class="orn"><i></i></div>'+P(TEXTO.pagina)
  +'<ol class="pl">'+PARTES.map((t,i)=>'<li><a href="#p'+(i+1)+'">'+esc(t)+'</a></li>').join('')+'</ol></div></section>'
  +sec(1,P(TEXTO.oque))+sec(2,P(TEXTO.objetivo))+sec(3,P(TEXTO.areasIntro)+areas)+sec(4,P(TEXTO.ordem))
  +sec(5,P(TEXTO.numeros)+nums)+sec(6,P(TEXTO.divisao)+P(TEXTO.blocos)+blocks)
  +sec(7,P(TEXTO.itemIntro)+demo)+sec(8,uso)+sec(9,mapa)
  +'<section class="cta rv"><div class="wrap"><p>'+esc(TEXTO.final)+'</p><a class="begin" href="#e'+first+'">Entrar na leitura</a></div></section>'
  +'<div class="wrap hend"><footer class="ft">'+FOOT+'</footer></div></div>';

 h+='<div class="col" id="reader">';
 E.forEach(e=>{
  h+='<section><header class="ch rv" id="e'+e.n+'" data-e="'+e.n+'"><div class="ey">Etapa</div><div class="rn">'+roman(e.n)+'</div><h2>'+esc(e.name)+'</h2><p>'+e.items.length+' itens<span class="ec"></span></p><div class="orn"><i></i></div></header>';
  e.items.forEach(it=>{h+=itemHTML(e,it,false)});
  h+='</section>';
 });
 h+='<div class="end"><div class="orn"><i></i></div>Fim da lista. <a href="#top">Voltar ao início</a></div><footer class="ft">'+FOOT+'</footer></div>';
 $('main').innerHTML=h;
 $('nav').innerHTML=E.map(e=>'<a href="#e'+e.n+'" data-n="'+e.n+'"><b>'+roman(e.n)+'</b><span>'+esc(e.name)+'</span></a>').join('');
 $('hbgo').href='#e'+first;
 if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.05});
  document.querySelectorAll('.rv').forEach(c=>io.observe(c));
 }else document.querySelectorAll('.rv').forEach(c=>c.classList.add('in'));
 cnt();
}

// Contadores de leitura (lateral, cabeçalhos das etapas, mapa e apresentação)
function cnt(){
 let n=0;
 E.forEach(e=>{e.c=e.items.reduce((s,it)=>s+(R.has(it.k)?1:0),0);n+=e.c});
 TR=n;
 const p=TOT?Math.round(n/TOT*100):0;
 $('lt').textContent='Lidos: '+n+' de '+TOT+' ('+p+'%)';$('lb').style.width=p+'%';
 E.forEach(e=>{
  const full=e.items.length>0&&e.c===e.items.length;
  const a=document.querySelector('nav a[data-n="'+e.n+'"]');if(a)a.classList.toggle('done',full);
  const pc=e.items.length?Math.round(e.c/e.items.length*100):0;
  const h=document.querySelector('#e'+e.n+' .ec');if(h)h.textContent=e.c?' · '+e.c+' lidos ('+pc+'%)':'';
  const m=document.querySelector('.mp[data-n="'+e.n+'"]');
  if(m){m.querySelector('.mc').textContent=e.c?' · '+e.c+' lidos ('+pc+'%)':'';m.querySelector('.mpb').style.width=(e.items.length?e.c/e.items.length*100:0)+'%'}
 });
 // estante: quanto de cada bloco já foi lido
 const bc={};
 E.forEach(e=>e.items.forEach(it=>{if(it.b){const o=bc[it.b]||(bc[it.b]={t:0,r:0});o.t++;if(R.has(it.k))o.r++}}));
 document.querySelectorAll('.sp').forEach(s=>{const o=bc[s.dataset.b]||{t:0,r:0};s.dataset.t=o.t;s.dataset.r=o.r;s.style.setProperty('--p',(o.t?o.r/o.t*100:0)+'%')});
 const on=document.querySelector('.sp.on');if(on)cap(on);
 const hp=$('hp');
 if(hp)hp.innerHTML=n?'<p>Você já marcou <b>'+n+'</b> de <b>'+TOT+'</b> itens como lidos ('+p+'%).</p><div class="bar"><i style="width:'+p+'%"></i></div><button class="lnk" id="rz" type="button">Apagar meu progresso</button>':'';
}

function cap(s){
 const t=+s.dataset.t,r=+s.dataset.r;
 $('scap').innerHTML='<b>Bloco '+s.dataset.b+' — '+esc(s.dataset.nm)+'</b>: '+t+' itens, '+r+' lidos ('+(t?Math.round(r/t*100):0)+'%)';
}
['mouseover','focusin'].forEach(ev=>document.addEventListener(ev,e=>{const s=e.target.closest&&e.target.closest('.sp');if(s)cap(s)}));
document.addEventListener('click',e=>{
 const sp=e.target.closest('.sp');
 if(sp){document.querySelectorAll('.sp.on').forEach(x=>x.classList.remove('on'));sp.classList.add('on');cap(sp);return}
 const b=e.target.closest('button.rd');
 if(b){
  const k=b.dataset.k,on=!R.has(k);
  if(on)R.add(k);else R.delete(k);
  b.setAttribute('aria-pressed',on);b.closest('.it').classList.toggle('lido',on);
  store('lidos',JSON.stringify([...R]));cnt();return;
 }
 if(e.target.id==='rz'){
  if(confirm('Apagar todos os itens marcados como lidos? Isso não pode ser desfeito.')){
   R.clear();store('lidos','[]');
   document.querySelectorAll('.it.lido').forEach(x=>{x.classList.remove('lido');const r=x.querySelector('button.rd');if(r)r.setAttribute('aria-pressed','false')});
   cnt();
  }
 }
});

function view(v){
 document.body.dataset.view=v;
 if(v==='read'&&innerWidth>820&&load('side')!=='0')document.body.classList.remove('closed');
}
function go(id){
 if(id==='top'){view('home');scrollTo(0,0);return}
 const el=$(id);if(!el)return;
 view(el.closest('#home')?'home':'read');
 const isIt=el.classList.contains('it');
 el.scrollIntoView({block:isIt?'center':'start'});
 if(isIt){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
 if(innerWidth<=820)document.body.classList.add('closed');
 setTimeout(track,300);
}
document.addEventListener('click',e=>{
 const a=e.target.closest('a[href^="#"]');if(!a)return;
 e.preventDefault();const id=a.getAttribute('href').slice(1);
 history.replaceState(null,'','#'+id);closeS();go(id);
});

let tk=0;
function track(){
 if(document.body.dataset.view!=='read')return;
 if($('ov').classList.contains('on'))return;
 const c=document.querySelector('.col');if(!c)return;
 const r=c.getBoundingClientRect(),y=Math.min(innerHeight*.3,260);
 const el=document.elementFromPoint(r.left+r.width/2,y);
 const n=el&&el.closest('[data-e]');
 if(!n){cur=null}else{
  cur=+n.dataset.e;
  if(n.dataset.g){store('pos',n.id);$('prog').textContent='Leitura: '+n.dataset.g+' de '+TOT}
 }
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',cur===+a.dataset.n));
 const act=document.querySelector('nav a.on');if(act)act.scrollIntoView({block:'nearest'});
 $('dEt').disabled=cur==null;$('dEt').textContent=cur==null?'Etapa atual (.md)':'Etapa '+roman(cur)+' (.md)';
}
addEventListener('scroll',()=>{if(!tk)tk=setTimeout(()=>{tk=0;track()},250)},{passive:true});

let raf=0;
function prog(){raf=0;const h=document.documentElement.scrollHeight-innerHeight;$('pg').style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';$('hb').classList.toggle('sc',scrollY>40)}
addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(prog)},{passive:true});
addEventListener('resize',()=>{if(!raf)raf=requestAnimationFrame(prog)});

function dl(text,name){
 const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
$('dEt').onclick=()=>{const e=E.find(x=>x.n===cur);if(e)dl(L.slice(e.line,e.end).join('\n').trimEnd()+'\n','etapa-'+e.n+'.md')};

function openS(v){$('ov').classList.add('on');const q=$('q');q.value=v||'';q.focus();res()}
function closeS(){$('ov').classList.remove('on')}
function snip(it,t){
 const k=it.dl.indexOf(t.find(x=>it.dl.includes(x))||'');
 const i=Math.max(0,(k<0?0:k)-50),s=it.d.slice(i,i+130);
 return (i>0?'…':'')+s+(i+130<it.d.length?'…':'');
}
function res(){
 const t=strip($('q').value).split(/\s+/).filter(Boolean);
 if(!t.length){$('rs').innerHTML='<p class="muted">Digite parte de um título, autor ou tema.</p>';return}
 const A=[],B=[],C=[],D=[];
 for(const e of E)for(const it of e.items){
  const ta=it.h0+' '+it.ha,te=ta+' '+it.he;
  if(t.every(x=>it.ha.includes(x)))A.push([e,it]);
  else if(t.every(x=>ta.includes(x)))B.push([e,it]);
  else if(t.every(x=>te.includes(x)))C.push([e,it]);
  else if(t.every(x=>(te+' '+it.dl).includes(x)))D.push([e,it]);
 }
 const row=([e,it],s)=>'<a href="#i'+e.n+'-'+it.n+'"><b>'+esc(plain(it.w))+'</b><small>'+esc(plain(it.a||'Autor não indicado'))+' — Etapa '+roman(e.n)+': '+esc(e.name)+'</small>'+(s?'<em>'+esc(snip(it,t))+'</em>':'')+'</a>';
 const grp=(n,l,s,m)=>n.length?'<h4>'+l+' ('+n.length+(n.length>m?', mostrando '+m:'')+')</h4>'+n.slice(0,m).map(r=>row(r,s)).join(''):'';
 $('rs').innerHTML=grp(A,'Obras do autor',0,150)+grp(B,'No título',0,100)+grp(C,'Na etapa com esse nome',0,60)+grp(D,'Citados nas descrições',1,60)||'<p class="muted">Nada encontrado.</p>';
}
$('q').addEventListener('input',res);
$('sb').onclick=()=>openS('');
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeS()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeS();return}
 if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1||!E.length)return;
 const t=document.activeElement.tagName;
 if(['INPUT','TEXTAREA','BUTTON','SUMMARY'].includes(t)&&document.activeElement.id!=='q')return;
 if(!$('ov').classList.contains('on')){e.preventDefault();openS(e.key==='/'?'':e.key)}
});
const side=o=>{document.body.classList.toggle('closed',!o);store('side',o?'1':'0')};
$('open').onclick=()=>side(true);$('close').onclick=()=>side(false);$('bd').onclick=()=>side(false);
function theme(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'Luz do dia':'Luz de lâmpada';store('theme',t)}
$('th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
theme(load('theme')==='dark'?'dark':'light');

function start(buf){
 parse(new TextDecoder('utf-8').decode(buf));
 if(!E.length)throw new Error('nenhuma linha "## Etapa N: ..." encontrada em '+FILE);
 document.title=T.title;build();
 const h=location.hash.slice(1),p=load('pos');
 if(p&&$(p)){const c=$('cont');c.hidden=false;c.href='#'+p}
 if(h)go(h);else if(p&&$(p))go(p);else view('home');
 track();prog();
 EXTRA.forEach(([f,n])=>fetch(f,{method:'HEAD'}).then(r=>{if(r.ok)$('extras').insertAdjacentHTML('beforeend','<a class="d" href="'+f+'" download>'+n+'</a>')}).catch(()=>{}));
}
function fail(e){
 const local=location.protocol==='file:';
 $('main').innerHTML='<div class="err">'+(local
  ?'Você abriu o arquivo direto do computador, e o navegador não deixa a página ler o <b>'+FILE+'</b> sozinha. Escolha o arquivo aqui para testar:'
  :'Não consegui carregar <b>'+FILE+'</b> ('+esc(String(e.message))+'). Você pode escolher o arquivo manualmente:')
  +'<p><input type="file" id="pick" accept=".md,.txt,text/markdown,text/plain"></p></div>';
 $('pick').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{start(await f.arrayBuffer())}catch(x){fail(x)}};
}
fetch(FILE,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(start).catch(fail);
</script>
</body>
</html>
